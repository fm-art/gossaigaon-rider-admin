name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Capacitor
        run: |
          bun install
          bun add @capacitor/core @capacitor/android @capacitor/local-notifications
          bun add -d @capacitor/cli

      - name: Build Vite Web App
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: bun run build

      - name: Add Android Platform & Notification Icon
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_stat_gb_admin.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M17.21,9l-4.38,-6.56c-0.19,-0.28 -0.51,-0.42 -0.83,-0.42c-0.32,0 -0.64,0.14 -0.83,0.43L6.79,9H2c-0.55,0 -1,0.45 -1,1c0,0.09 0.01,0.18 0.04,0.27l2.54,9.27C3.85,20.38 4.62,21 5.5,21h13c0.88,0 1.65,-0.62 1.92,-1.46l2.54,-9.27L23,10c0,-0.55 -0.45,-1 -1,-1H17.21zM9,9l3,-4.4L15,9H9zM12,17c-1.1,0 -2,-0.9 -2,-2s0.9,-2 2,-2s2,0.9 2,2S13.1,17 12,17z"/>
          </vector>
          EOF
          bunx cap sync android
          cp google-services.json android/app/google-services.json || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GB-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
