name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Capacitor
        run: |
          bun install
          bun add @capacitor/core @capacitor/android @capacitor/local-notifications
          bun add -d @capacitor/cli

      - name: Build Vite Web App
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: bun run build

      - name: Add & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android
          cp google-services.json android/app/google-services.json || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GB-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
